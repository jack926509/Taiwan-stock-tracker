<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離線中 — 台股追蹤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    background-color: #f2ecdd;
    background-image: radial-gradient(circle at 12% 0%, #fbf7ec, transparent 60%);
    color: #211d16;
  }
  .card {
    width: 100%;
    max-width: 20rem;
    background: #fffdf7;
    border: 1px solid #ddd3bf;
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(33, 29, 22, 0.06);
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .badge {
    display: inline-grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.625rem;
    background: #1a3a63;
    color: #f7f2e7;
    font-weight: 700;
    font-size: 1.125rem;
  }
  h1 {
    margin-top: 0.875rem;
    font-family: "Songti TC", "Noto Serif CJK TC", Georgia, serif;
    font-size: 1.125rem;
  }
  p {
    margin-top: 0.5rem;
    font-size: 0.8125rem;
    line-height: 1.6;
    color: #6f6553;
  }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.625rem 1rem;
    border: 0;
    border-radius: 999px;
    background: #1a3a63;
    color: #fff;
    font-size: 0.875rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <main class="card">
    <span class="badge" aria-hidden="true">台</span>
    <h1>目前離線</h1>
    <p>連不上網路，即時報價暫時無法載入。<br>恢復連線後點下方按鈕即可繼續。</p>
    <button onclick="location.reload()">重新載入</button>
  </main>
</body>
</html>
