name: 部署 Cloudflare Pages 前端

# 只建置、部署 frontend/ 這個靜態站；Zeabur（主程式）由 Zeabur 自己的 GitHub 整合處理，不受影響。
# 2026-07-20：改用這個 workflow 直接呼叫 wrangler 部署，繞開 Cloudflare 內建 Git 整合的建置
#（該建置只能看到 frontend/ 子目錄本身，讀不到 frontend/ 依路徑別名共用的上層 app/、
# components/、lib/，一律失敗；GitHub Actions 用完整 checkout 沒有這個限制）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 frontend 相依套件
        working-directory: frontend
        run: npm ci

      - name: 建置靜態輸出
        working-directory: frontend
        run: npm run build

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7f317345f0f1b68b16bb2ccfbcd731d9
          command: pages deploy frontend/out --project-name=tw-stock-tracker --branch=main
