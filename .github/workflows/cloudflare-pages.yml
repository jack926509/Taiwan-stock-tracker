name: 部署 Cloudflare Pages 前端

# 只建置、部署 frontend/ 這個靜態站；Zeabur（主程式）由 Zeabur 自己的 GitHub 整合處理，不受影響。
# 2026-07-20：改用這個 workflow 直接呼叫 wrangler 部署，繞開 Cloudflare 內建 Git 整合的建置
#（實測失敗原因：只在 frontend/ 裝相依套件，但 frontend/ 透過路徑別名 externalDir
# 共用上層 app/、components/、lib/，那些檔案 import 的 swr 等套件只在根目錄
# package.json，根目錄沒裝 node_modules 就會 Module not found；本檔同時裝根目錄與
# frontend/ 兩份相依套件即可解決）。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝根目錄相依套件（frontend/ 透過路徑別名共用的 app/、components/、lib/ 需要）
        run: npm ci

      - name: 安裝 frontend 相依套件
        working-directory: frontend
        run: npm ci

      - name: 建置靜態輸出
        working-directory: frontend
        run: npm run build

      # 必須在 frontend/ 目錄下執行 wrangler：Pages Functions（API 代理，functions/api/[[path]].ts）
      # 是相對「執行目錄」探測 functions/ 資料夾的。舊版從 repo 根目錄跑 `pages deploy frontend/out`，
      # 根目錄沒有 functions/ → wrangler 靜默部署成純靜態站、/api/* 全部 404 → 前端抓不到報價（沒有資料）。
      # 改成 workingDirectory: frontend + `pages deploy out`，wrangler 才會找到 frontend/functions 並把
      # API 代理一起部署（自訂 out/_routes.json 已 include /api/* 與 /stock/*）。
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7f317345f0f1b68b16bb2ccfbcd731d9
          workingDirectory: frontend
          command: pages deploy out --project-name=tw-stock-tracker --branch=main
