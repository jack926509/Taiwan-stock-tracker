name: 驗證 Cloudflare Worker

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝鎖定相依套件
        run: npm ci

      - name: 執行完整測試
        run: npm test

      - name: 建置 Next.js
        run: npm run build

      - name: 建置 Cloudflare Worker
        run: npm run cf:build
